id: ggplot2_py.sum_without_start
name: "`sum([aes(...), geom_*(), ...])` without `start=ggplot(df)`"
applicable_to:
  - ggplot2_py.singledispatch_composition
  - ggplot2_py.plus_accumulation
detection:
  # Match a `sum([ ... ])` whose list literal mentions a ggplot component
  # (geom_ / aes( / theme_) AND whose closing `]` is immediately followed by
  # the call's `)` — i.e. NO trailing `start=` keyword. A plain numeric
  # `sum([1, 2, 3])` has no ggplot token, so it is not flagged; a correct
  # `sum([...], start=ggplot(df))` has `, start=` after `]`, so `]\s*)` fails
  # to match. (No re.MULTILINE here, but no anchors are used either.)
  regex: 'sum\s*\(\s*\[[^\]]*(?:geom_|aes\s*\(|theme_)[^\]]*\](?:\s*\))'
  static_only: true
why_bad: |
  Python-exclusive trap. ggplot2_py supports functional composition because
  `GGPlot.__add__` is registered with the `update_ggplot` singledispatch
  generic, so `sum(parts, start=ggplot(df))` and
  `reduce(add, parts, ggplot(df))` both build a plot. But Python's built-in
  `sum(iterable, /, start=0)` defaults `start` to the **integer 0**. Without
  an explicit `start=ggplot(df)`, the very first addition is
  `0 + aes(...)`, which raises:

      TypeError: unsupported operand type(s) for +: 'int' and 'Mapping'

  (or `'int' and 'Layer'`, depending on the first element). The README's
  functional-composition section calls this out explicitly: the seed object
  MUST be a `GGPlot`, supplied via `start=`.

  Note `sum` takes ONE iterable plus an optional `start` — `sum(a, b, c)`
  (variadic) is a different error (`TypeError: sum() takes at most 2
  arguments`); use a list/tuple or `reduce`.
correct_pattern: ggplot2_py.functional_composition
code_example_wrong: |
  # `start` defaults to int 0 -> `0 + aes(...)` raises TypeError:
  sum([aes(x="displ", y="hwy"), geom_point(), theme_minimal()])
code_example_right: |
  # Seed the accumulation with a GGPlot via `start=`:
  sum([aes(x="displ", y="hwy"), geom_point(), theme_minimal()], start=ggplot(mpg))
  # equivalently, the canonical Python composition operator:
  from functools import reduce
  from operator import add
  reduce(add, [aes(x="displ", y="hwy"), geom_point()], ggplot(mpg))
