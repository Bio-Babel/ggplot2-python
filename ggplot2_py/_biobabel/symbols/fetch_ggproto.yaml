id: ggplot2_py.fetch_ggproto
import_path: ggplot2_py.fetch_ggproto
kind: function
signature: fetch_ggproto(x, name)
purpose: read a member from a GGProto object, walking up the super() chain if absent locally; introspect an inherited slot/method on a geom/stat/scale/coord/facet/position/guide
description: 'Retrieve the member `name` from the `GGProto` object `x`. Mirrors R''s

  `fetch_ggproto` recursion (R ref `ggproto.R:118-142`): look up `name` on `x`;

  if it is absent there, walk into `x.super()` and try again, continuing up the

  chain. Raises `AttributeError` if the member is found nowhere in the chain.


  Use this from extension code when you need an inherited slot or method by name

  (e.g. when generically resolving `default_aes` or a draw method) rather than

  relying on normal attribute access. Returns the member value (a slot value or

  an unbound/bound callable, depending on the member).

  '
parameters:
- name: x
  type: Any
  required: true
  default: null
  description: A GGProto class or instance to read from.
- name: name
  type: str
  required: true
  default: null
  description: The member name to look up (slot or method).
mutates: execution_class=stateless; no declared in-place mutation; returns_kind=value
returns: Any; kind=value
requires: []
writes: []
examples:
- default_aes = fetch_ggproto(my_geom, 'default_aes')
- draw = fetch_ggproto(GeomPoint, 'draw_panel')
failure_fixes:
- when: 'AttributeError: member not found in the ggproto chain'
  suggest:
  - Check the member name and that x (or an ancestor) actually defines it; fetch_ggproto raises if it is nowhere in the super() chain.
- when: you want to CALL a parent's implementation, not just read it
  suggest:
  - Use ggproto_parent(Parent, self).method(...) to invoke the parent method with proper binding.
related:
- ggplot2_py.ggproto_parent
- ggplot2_py.bind_method
