id: ggplot2_py.geom_bar
import_path: ggplot2_py.geom_bar
kind: function
signature: geom_bar(mapping=None, stat='count', position='stack', inherit_aes=True)
purpose: bar chart; category counts or summed totals
description: 'Default stat=''count'' — bars heights are row counts per x level. For

  pre-summarized data where y is the bar height, set stat=''identity'' or

  use the shortcut geom_col().

  '
parameters:
- name: mapping
  type: Mapping
  required: false
  default: null
- name: stat
  type: str
  required: false
  default: count
  description: '''count'' (default) or ''identity'' for pre-summarized y.'
- name: position
  type: str
  required: false
  default: stack
  description: '''stack'' (default), ''dodge'', ''fill''.'
- name: inherit_aes
  type: bool
  required: false
  default: true
  description: If False, do not inherit the plot-level aes() mapping — use only this layer's own mapping. Set False for overlay layers with differently-shaped `data=`.
mutates: execution_class=builder; no declared in-place mutation; returns_kind=new_object
returns: Layer; kind=new_object
requires: []
writes: []
examples:
- ggplot(mpg, aes(x='class')) + geom_bar()
- ggplot(df_sum, aes(x='class', y='count')) + geom_col()
failure_fixes:
- when: bars don't appear / wrong heights for pre-summarized data
  suggest:
  - Set stat='identity' or use geom_col() instead of geom_bar()
- when: stacked bars instead of side-by-side
  suggest:
  - position='dodge'
related:
- ggplot2_py.facet_wrap
- ggplot2_py.labs
