id: ggplot2_py.update_ggplot
import_path: ggplot2_py.update_ggplot
kind: function
signature: update_ggplot(obj, plot, object_name='')
purpose: extend the + operator to a custom Python type; register a handler for adding an object to a GGPlot
description: 'The ``functools.singledispatch`` generic that ``GGPlot.__add__`` dispatches

  through. Every ``plot + obj`` resolves to ``update_ggplot(obj, plot)``,

  dispatched on the runtime type of ``obj``; the handler mutates/returns the

  plot and that becomes the new plot. Because it is an open generic, ANY

  Python class can be made addable with ``+`` by registering a handler — no

  subclassing, no metaclass: ``@update_ggplot.register(MyClass)``. The handler

  receives ``(obj, plot, object_name="")`` and MUST return the (possibly

  modified) plot. This is the Python-exclusive extension seam behind layers,

  scales, themes, coords and facets all sharing one ``+`` operator.

  See idiom ``ggplot2_py.register_plus_type``.

  '
parameters:
- name: obj
  type: Any
  required: true
  default: null
  description: The object being added via +; dispatch is on its runtime type.
- name: plot
  type: GGPlot
  required: true
  default: null
  description: The plot on the left of +; the handler mutates and returns it.
- name: object_name
  type: str
  required: false
  default: ''
  description: Name of the object as written in user code; used only for nicer error messages.
mutates: execution_class=stateless; no declared in-place mutation; returns_kind=new_object
returns: GGPlot; kind=new_object
requires: []
writes: []
examples:
- "from ggplot2_py import ggplot, aes, geom_point, update_ggplot\nfrom ggplot2_py.datasets import mpg\n\nclass Watermark:\n    def __init__(self, text): self.text = text\n\n@update_ggplot.register(Watermark)\ndef _add_watermark(obj, plot, object_name=\"\"):\n    plot.labels[\"caption\"] = f\"[{obj.text}]\"\n    return plot\n\np = ggplot(mpg, aes(\"displ\", \"hwy\")) + geom_point() + Watermark(\"DRAFT\")\nassert p.labels.get(\"caption\") == \"[DRAFT]\"\n"
failure_fixes:
- when: 'TypeError: cannot add object of type X to a ggplot'
  suggest:
  - 'Register a handler: @update_ggplot.register(X) def _add(obj, plot, object_name=''''): ...; return plot'
  - The handler MUST return the plot — returning None drops it
- when: circular import when registering at module import time
  suggest:
  - Register in the type's own module (its tail), not in plot.py — see guide.py for the pattern
related:
- ggplot2_py.ggsave
