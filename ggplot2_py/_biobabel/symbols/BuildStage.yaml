id: ggplot2_py.BuildStage
import_path: ggplot2_py.BuildStage
kind: class
signature: BuildStage()
purpose: name a ggplot_build pipeline stage when registering a build hook; discover the 16 build-pipeline stages an extension can hook before/after
description: "Named constants for the `ggplot_build` pipeline stages. `BuildStage` is a\nplain class whose attributes are string constants (NOT an Enum); each constant\nnames a real operation in R's `plot-build.R` `ggplot_build.ggplot()`, in the\nsame order.\n\nThese constants are used with the GGPlot method `add_build_hook(timing, stage, fn)`\nto register a `\"before\"`/`\"after\"` callback on a specific stage. This is a\nPYTHON-EXCLUSIVE extension point — R's ggplot2 does not expose hooks on\nindividual build stages.\n\nThe 16 stage constants (attribute -> string value), in pipeline order:\n  - SETUP_LAYER        = \"setup_layer\"\n  - LAYER_DATA         = \"layer_data\"\n  - SETUP_LAYOUT       = \"setup_layout\"        (ctx: layout)\n  - COMPUTE_AESTHETICS = \"compute_aesthetics\"\n  - SETUP_GUIDES       = \"setup_guides\"        (ctx: layout, guides)\n  - TRANSFORM_SCALES   = \"transform_scales\"    (ctx: scales)\n  - COMPUTE_STAT       = \"compute_stat\"        (ctx: layout)\n  - MAP_STAT\
  \           = \"map_stat\"\n  - FINISH_STAT        = \"finish_stat\"\n  - COMPUTE_GEOM_1     = \"compute_geom_1\"\n  - COMPUTE_POSITION   = \"compute_position\"    (ctx: layout)\n  - RETRAIN_POSITION   = \"retrain_position\"    (ctx: layout, scales)\n  - COMPUTE_GEOM_2     = \"compute_geom_2\"\n  - TRAIN_POSITION     = \"train_position\"      (ctx: layout, scales)\n  - TRAIN_NONPOSITION  = \"train_nonposition\"\n  - FINISH_DATA        = \"finish_data\"\n\nThe hook signature is `fn(data, **ctx) -> list | Any`: `data` is the current\nper-layer data list; return a new `list` to replace it, or any non-list\n(including None) to leave it unchanged. `**ctx` carries stage-specific context\nas noted above (e.g. `layout`, `scales`, `guides`).\n\nRegister via the plot method, e.g.:\n  `plot.add_build_hook(\"after\", BuildStage.COMPUTE_STAT, fn)`.\n"
parameters: []
mutates: execution_class=stateless; no declared in-place mutation; returns_kind=value
returns: type[BuildStage]; kind=value
requires: []
writes: []
examples:
- 'plot = plot.add_build_hook(''after'', BuildStage.COMPUTE_STAT, lambda data, **ctx: [d.assign(extra=1) for d in data])'
- plot = plot.add_build_hook('before', BuildStage.FINISH_DATA, my_inspector)
failure_fixes:
- when: build hook never fires
  suggest:
  - Pass a real BuildStage constant (e.g. BuildStage.COMPUTE_STAT) as the stage, and 'before' or 'after' as the timing, to plot.add_build_hook.
- when: returning the modified data from a hook had no effect
  suggest:
  - Return a LIST (the per-layer data list) to replace the data; any non-list return (including None) is ignored and leaves data unchanged.
