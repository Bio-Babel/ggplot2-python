id: ggplot2_py.theme_light
import_path: ggplot2_py.theme_light
kind: function
signature: theme_light(base_size=11, base_family='', header_family=None, base_line_size=None, base_rect_size=None, ink='black', paper='white', accent='#3366FF')
purpose: apply a light-grey themed plot with subtle chrome; a softer alternative to theme_bw — light grey lines instead of black
description: 'Complete Theme with light-grey axis lines and panel border on a white

  background — visually similar to `theme_linedraw` but with greys

  instead of pure black, producing a softer look that still keeps a

  visible panel boundary. Same builder contract as `theme_bw`.

  '
parameters:
