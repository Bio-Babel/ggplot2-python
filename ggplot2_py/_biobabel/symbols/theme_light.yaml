  type: float
  required: false
  default: 11
- name: base_family
  type: str
  required: false
  default: ''
- name: header_family
  type: Optional[str]
  required: false
  default: null
- name: base_line_size
  type: Optional[float]
  required: false
  default: null
- name: base_rect_size
  type: Optional[float]
  required: false
  default: null
- name: ink
  type: str
  required: false
  default: black
- name: paper
  type: str
  required: false
  default: white
- name: accent
  type: str
  required: false
  default: '#3366FF'
mutates: execution_class=builder; no declared in-place mutation; returns_kind=new_object
returns: Theme; kind=new_object
requires: []
writes: []
examples:
