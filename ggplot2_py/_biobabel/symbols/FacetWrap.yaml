examples:
- "# Custom facet: subclass FacetWrap and override compute_layout.\nfrom ggplot2_py.facet import FacetWrap, facet_wrap\n\nclass MyFacet(FacetWrap):\n    def compute_layout(self, data, params):\n        # LAYOUT table has one row per panel with columns\n        # PANEL / ROW / COL / SCALE_X / SCALE_Y.\n        layout = super().compute_layout(data, params).copy()\n        # ... edit PANEL/ROW/COL/SCALE_X/SCALE_Y here ...\n        return layout\n\nbase = facet_wrap('category')   # fully-configured FacetWrap (resolves params)\nf = MyFacet()\nf.shrink = base.shrink\nf.params = base.params          # reuse resolved params (facets, nrow, ncol, ...)\n# NOTE: the panel grid comes from nrow/ncol in params, not from the COL/ROW\n# values above; set them via facet_wrap(..., nrow=..., ncol=...).\n"
failure_fixes:
- when: the compute_layout table's COL (or ROW) values are edited but panels overlap / collide / land in the wrong place
  suggest:
  - Editing COL/ROW alone does NOT change the panel GRID; the grid shape is fixed by nrow/ncol in params.
  - Set nrow/ncol (e.g. via facet_wrap(..., nrow=..., ncol=...)) so the grid matches the positions you assign, otherwise multiple panels map to the same grid cell and collide.
