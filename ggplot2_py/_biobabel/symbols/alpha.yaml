id: ggplot2_py.alpha
import_path: ggplot2_py.alpha
kind: function
signature: alpha(colour, alpha_value=None)
purpose: set or override the alpha (opacity) channel of a colour string or vector of colours; derive a translucent colour from an already-resolved colour, e.g. inside after_scale()
description: 'Re-export of `scales.colour_manip.alpha` (mirror of R''s `scales::alpha()` /

  `ggplot2::alpha()`). Takes a colour spec (name, hex, etc.) or a sequence of

  them and returns `#RRGGBBAA` hex string(s) with the requested opacity.


  Vectorisation follows R semantics: a scalar `alpha_value` is applied to every

  colour; a length-1 colour is recycled against a vector `alpha_value`; mismatched

  non-trivial lengths raise. An `alpha_value` of `None`/NaN keeps each colour''s

  original alpha. With `alpha_value=None` the colours are returned unchanged

  (still normalised to `#RRGGBBAA`).


  Typical use is to fade an aesthetic that the scale just produced, e.g.

  `aes(fill=after_scale(lambda d: alpha(d[''colour''], 0.3)))`.

  '
parameters:
- name: colour
  type: str | Sequence[str]
  required: true
  default: null
  description: One colour spec (name/hex) or a sequence of them.
- name: alpha_value
  type: float | Sequence[float | None] | None
  required: false
  default: null
  description: Opacity in [0, 1]; scalar applied to all, or a per-colour vector. None/NaN keeps the original alpha.
mutates: execution_class=stateless; no declared in-place mutation; returns_kind=value
returns: str | List[str]; kind=value
requires: []
writes: []
examples:
- 'alpha(''red'', 0.5)  # ''#ff000080'''
- alpha(['red', 'blue'], [0.2, 0.8])
- 'aes(fill=after_scale(lambda d: alpha(d[''colour''], 0.3)))'
failure_fixes:
- when: 'ValueError: colour and alpha_value must have compatible lengths'
  suggest:
  - Pass a scalar alpha (applied to all), a length-1 colour, or matching-length vectors.
- when: returned string has 8 hex digits even though alpha was opaque
  suggest:
  - 'Expected: alpha() always emits #RRGGBBAA (matching R''s farver). Use it as-is; downstream colour handling accepts the alpha hex.'
related:
- ggplot2_py.after_scale
- ggplot2_py.scale_colour_manual
