id: ggplot2_py.extension.is_protected
import_path: ggplot2_py.extension.is_protected
kind: function
signature: is_protected(obj, aes_name, attr='_ggnewscale_renamed')
purpose: check whether an object was already marked renamed for an aesthetic, to skip re-renaming it
description: 'Return `True` if `obj` was previously marked (via `protect`) as already-renamed

  for aesthetic `aes_name`, else `False`. The read side of the ggnewscale-style

  rename idempotency guard: gate a rename on `not is_protected(obj, aes_name)` so

  stacked `new_scale()` passes never rename the same aesthetic twice.

  '
parameters:
- name: obj
  type: Any
  required: true
  default: null
  description: The object to test.
- name: aes_name
  type: str
  required: true
  default: null
  description: The aesthetic name to check protection for (e.g. 'colour').
- name: attr
  type: str
  required: false
  default: _ggnewscale_renamed
  description: Name of the sentinel attribute checked (keyword-only); must match the one used in protect.
mutates: execution_class=stateless; no declared in-place mutation; returns_kind=value
returns: bool; kind=value
requires: []
writes: []
examples:
- "if not is_protected(geom, 'colour'):\n    rename_aes_on(geom, 'colour', 'colour_new'); protect(geom, 'colour')"
failure_fixes:
- when: is_protected always returns False after protect
  suggest:
  - Use the SAME attr keyword in both protect and is_protected; they must agree on the sentinel attribute name.
related:
- ggplot2_py.extension.protect
