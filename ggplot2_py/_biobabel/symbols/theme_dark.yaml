id: ggplot2_py.theme_dark
import_path: ggplot2_py.theme_dark
kind: function
signature: theme_dark(base_size=11, base_family='', header_family=None, base_line_size=None, base_rect_size=None, ink='black', paper='white', accent='#3366FF')
purpose: dark-panel variant of theme_light; make light/bright geoms (e.g. fluorescent colours) pop
description: 'Complete Theme with a dark panel background — the dark cousin of

  `theme_light`. Use when foreground geoms are bright or fluorescent

  (e.g. neon-coloured points on a dark slide background). Same builder

  contract as `theme_bw` (replaces inherited theme; chain `+ theme(...)`

  afterward).

  '
parameters:
- name: base_size
  type: float
  required: false
  default: 11
- name: base_family
  type: str
  required: false
  default: ''
- name: header_family
  type: Optional[str]
  required: false
  default: null
- name: base_line_size
  type: Optional[float]
  required: false
  default: null
- name: base_rect_size
  type: Optional[float]
  required: false
  default: null
- name: ink
  type: str
  required: false
  default: black
- name: paper
  type: str
  required: false
  default: white
- name: accent
  type: str
  required: false
  default: '#3366FF'
mutates: execution_class=builder; no declared in-place mutation; returns_kind=new_object
returns: Theme; kind=new_object
requires: []
writes: []
examples:
- p + theme_dark()
failure_fixes: []
related:
