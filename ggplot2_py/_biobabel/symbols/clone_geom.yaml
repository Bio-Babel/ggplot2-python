id: ggplot2_py.extension.clone_geom
import_path: ggplot2_py.extension.clone_geom
kind: function
signature: clone_geom(geom)
purpose: make an independent copy of a geom so an extension can mutate slots without affecting the original
description: 'Return an independent copy of the `GGProto` geom `geom`, so an extension can

  modify its slots (e.g. rename an aesthetic in `default_aes`) without mutating

  the shared/registered original. Part of the ggnewscale-style aesthetic-rename

  toolkit. Returns a new `GGProto` geom.

  '
parameters:
- name: geom
  type: GGProto
  required: true
  default: null
  description: The geom (GGProto class or instance) to clone.
mutates: execution_class=builder; no declared in-place mutation; returns_kind=new_object
returns: GGProto; kind=new_object
requires: []
writes: []
examples:
- g2 = clone_geom(layer.geom); g2.default_aes = rename_aes_in_dict(g2.default_aes, 'colour', 'colour_ggnewscale_1')
failure_fixes:
- when: mutating a geom changed every layer that shares it
  suggest:
  - Clone first with clone_geom(geom), then mutate the clone; the registered original stays untouched.
related:
- ggplot2_py.extension.clone_layer
- ggplot2_py.extension.rename_aes_in_dict
