id: ggplot2_py.geom_linerange
import_path: ggplot2_py.geom_linerange
kind: function
signature: geom_linerange(mapping=None, data=None, stat='identity', position='identity', orientation=None)
purpose: vertical range bars without horizontal caps; uncapped error bars / interval lines
description: 'Like geom_errorbar without horizontal caps; see geom_errorbar for full failure modes.

  Draws a vertical line at each x from `ymin` to `ymax`. Use this when caps

  add visual clutter or when you''ll add a midpoint via `geom_point` (which is

  the geom_pointrange combo).

  '
parameters:
- name: mapping
  type: Mapping
  required: false
  default: null
  description: Needs x, ymin, ymax.
- name: data
  type: DataFrame
  required: false
  default: null
- name: stat
  type: str
  required: false
  default: identity
- name: position
  type: str
  required: false
  default: identity
- name: orientation
  type: str | None
  required: false
  default: null
mutates: execution_class=builder; no declared in-place mutation; returns_kind=new_object
returns: Layer; kind=new_object
requires: []
writes: []
examples:
- geom_linerange(aes(x='gene', ymin='lo', ymax='hi'))
failure_fixes:
- when: blank — only y mapped
  suggest:
  - geom_linerange needs ymin AND ymax mapped; map both or use geom_pointrange for midpoint+range.
related:
- ggplot2_py.geom_point
- ggplot2_py.facet_wrap
