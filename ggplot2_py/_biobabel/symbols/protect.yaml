id: ggplot2_py.extension.protect
import_path: ggplot2_py.extension.protect
kind: function
signature: protect(obj, aes_name, attr='_ggnewscale_renamed')
purpose: mark an object as already-renamed for a given aesthetic so a later rename pass skips it (idempotency guard)
description: 'Mark `obj` as already-renamed for aesthetic `aes_name` by setting a sentinel

  attribute on it, so a subsequent aesthetic-rename pass treats it as protected

  and does not rename it again. This is the idempotency guard in the

  ggnewscale-style rename toolkit: when several `new_scale()` layers stack, each

  rename pass must skip objects an earlier pass already handled. Returns `obj`

  (mutated in place with the sentinel attribute).

  '
parameters:
- name: obj
  type: Any
  required: true
  default: null
  description: The object to mark as protected (a geom, stat, layer, mapping holder, ...).
- name: aes_name
  type: str
  required: true
  default: null
  description: The aesthetic name the protection applies to (e.g. 'colour').
- name: attr
  type: str
  required: false
  default: _ggnewscale_renamed
  description: Name of the sentinel attribute used to record protection (keyword-only).
mutates: execution_class=stateless; no declared in-place mutation; returns_kind=same_object
returns: Any; kind=same_object
requires: []
writes: []
examples:
- 'protect(geom, ''colour'')  # later rename passes skip this geom''s colour'
failure_fixes:
- when: an aesthetic gets renamed twice across stacked new_scale layers
  suggest:
  - Call protect(obj, aes_name) after the first rename and gate the rename on is_protected(obj, aes_name).
related:
- ggplot2_py.extension.is_protected
