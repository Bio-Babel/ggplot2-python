id: ggplot2_py.Position
import_path: ggplot2_py.Position
kind: class
signature: Position()
purpose: author a NEW position adjustment by subclassing Position; discover the compute_panel/compute_layer override points for a custom position; port an R ggproto Position (PositionXxx) to Python
description: "Base class for position adjustments. A position adjustment resolves overlap\nbetween geoms by shifting/stacking/dodging/jittering their coordinates after\nthe stat runs. To create a custom position, subclass `Position`\n(or `ggproto('PositionFoo', Position, ...)`) and wrap it in a\n`position_foo()` constructor.\n\nSUBCLASSING — set these CLASS ATTRIBUTES (slots):\n  - `required_aes`: aesthetics the adjustment needs (e.g. `(\"x\", \"y\")`).\n  - `default_aes`: fallback aesthetics, applied via `use_defaults`.\n\nSUBCLASSING — OVERRIDE these METHODS:\n  - `compute_panel(self, data, params, scales=None) -> data`: the usual\n    override; adjust all rows of one panel together (e.g. compute group\n    offsets across the panel).\n  - `compute_layer(self, data, params, layout) -> data`: lowest-level hook;\n    the default splits by panel and calls compute_panel.\n  - `setup_params(self, data) -> params`: read settings off the data and\n    return the params dict consumed by compute_*.\n\
  \  - `setup_data(self, data, params) -> data`: pre-adjust massaging.\n\nSubclasses AUTO-REGISTER into `Position._registry` via `__init_subclass__`,\nso `position=\"foo\"` strings can resolve them.\n\nReturns a CLASS. See concept `ggplot2_py.extension_class_hierarchy`.\n"
parameters: []
mutates: execution_class=builder; no declared in-place mutation; returns_kind=new_object
returns: type[Position]; kind=new_object
requires: []
writes: []
examples:
- "class PositionNudgeUp(Position):\n    required_aes = (\"x\", \"y\")\n    def compute_panel(self, data, params, scales=None):\n        data = data.copy(); data[\"y\"] = data[\"y\"] + 0.1\n        return data\n"
- '# R-port form:

  # PositionFoo = ggproto(''PositionFoo'', Position, compute_panel=lambda self, data, params, scales=None: ...)'
failure_fixes:
- when: the custom position has no effect on overlapping geoms
  suggest:
  - Override compute_panel (or compute_layer) and return a DataFrame with adjusted x/y/xmin/xmax; the base methods pass data through unchanged.
- when: need per-group offsets within a panel
  suggest:
  - Compute group offsets across the whole panel in compute_panel, where you can see all groups at once.
related:
- ggplot2_py.ggproto
- ggplot2_py.ggproto_parent
