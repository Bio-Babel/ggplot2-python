id: ggplot2_py.last_plot
import_path: ggplot2_py.last_plot
kind: function
signature: last_plot()
purpose: retrieve the most recently displayed plot (set by print_plot / set_last_plot)
description: "Return the most recently displayed/registered plot, or `None` if no\nplot has been set in this interpreter session yet.\n\nImplementation: `last_plot = get_last_plot` — it's the same function,\nre-exported under both names for R parity (`ggplot2::last_plot`) and\nthe Python-style `get_last_plot` accessor.\n\nThe \"last plot\" is a process-global in `ggplot2_py.plot._last_plot`,\nupdated by `print_plot()` (and explicitly via `set_last_plot()`). It is\nthe implicit default for `ggsave()` when no plot is provided.\n\nCAVEATS:\n  - Returns None at interpreter start until something has been\n    displayed.\n  - Not thread-safe (single global).\n  - In Jupyter, gets updated as cells run; in a script, only after the\n    first `plot.show()` / `print_plot()` / `set_last_plot()`.\n\nSee `set_last_plot` for the WARNING about global mutation.\n"
parameters: []
mutates: execution_class=stateless; no declared in-place mutation; returns_kind=value
returns: GGPlot | None; kind=value
requires: []
writes: []
examples:
- 'p = last_plot()  # None until something is displayed'
- 'ggsave(''out.png'')  # uses last_plot() implicitly'
failure_fixes:
- when: last_plot() returns None
  suggest:
  - Either no plot has been displayed yet (call print_plot(p) first), or set_last_plot was cleared. Display a plot or pass the plot explicitly to ggsave.
- when: want the plot from a different thread / process
  suggest:
  - Don't use last_plot — it's a per-process global. Pass plots explicitly across thread/process boundaries.
- when: ggsave saves a stale plot
  suggest:
  - last_plot is the LAST one displayed, not necessarily the one you mean. Always prefer ggsave(filename, plot=p) over the implicit form.
related:
- ggplot2_py.ggsave
