id: ggplot2_py.extension.rename_aes_in_mapping
import_path: ggplot2_py.extension.rename_aes_in_mapping
kind: function
signature: rename_aes_in_mapping(mapping, old, new)
purpose: rename an aesthetic inside an aes() mapping object for the new_scale pattern
description: 'Return a copy of the aesthetic `mapping` (an `aes()`-style mapping) with the

  aesthetic `old` renamed to `new`, preserving the bound expression/quosure for

  that aesthetic. Used by the ggnewscale-style toolkit to rewrite a layer or

  plot mapping so a duplicated aesthetic gets a private name. Does not mutate the

  input.

  '
parameters:
- name: mapping
  type: Mapping
  required: true
  default: null
  description: The aes() mapping to rewrite.
- name: old
  type: str
  required: true
  default: null
  description: The existing aesthetic name (e.g. 'colour').
- name: new
  type: str
  required: true
  default: null
  description: The replacement aesthetic name (e.g. 'colour_ggnewscale_1').
mutates: execution_class=stateless; no declared in-place mutation; returns_kind=new_object
returns: Mapping; kind=new_object
requires: []
writes: []
examples:
- layer.mapping = rename_aes_in_mapping(layer.mapping, 'colour', 'colour_new')
failure_fixes:
- when: the layer still maps the old aesthetic
  suggest:
  - 'Assign the returned mapping back: layer.mapping = rename_aes_in_mapping(layer.mapping, ''colour'', ''colour_new'').'
related:
- ggplot2_py.extension.rename_aes_in_dict
- ggplot2_py.extension.rename_aes_in_seq
