id: ggplot2_py.scale_y_log10
import_path: ggplot2_py.scale_y_log10
kind: function
signature: scale_y_log10(**kwargs=None)
purpose: log10 y axis
description: 'y-axis mirror of scale_x_log10; see scale_x_log10 for behaviour / failure

  modes (zeros & negatives produce a warning + dropped rows; use

  `pseudo_log_trans` if data crosses zero). Forwards `**kwargs` to

  scale_y_continuous with `transform=transform_log10()` as the default.

  '
parameters:
- name: '**kwargs'
  type: any
  required: false
  default: null
mutates: execution_class=builder; no declared in-place mutation; returns_kind=new_object
returns: Scale; kind=new_object
requires: []
writes: []
examples:
- p + scale_y_log10()
failure_fixes:
- when: 'warning: zeros or negatives removed'
  suggest:
  - log10 is undefined at <=0; filter rows where y>0, or use pseudo_log_trans().
related:
- ggplot2_py.scale_x_log10
