id: ggplot2_py.standardise_aes_names
import_path: ggplot2_py.standardise_aes_names
kind: function
signature: standardise_aes_names(aes_names)
purpose: normalize aesthetic names to their canonical ggplot2 forms; accept American spellings and R graphics aliases for aesthetics
description: "Map a sequence of aesthetic names to their canonical forms, preserving\norder. VERIFIED behavior (by calling on sample inputs):\n\n- British spelling is canonical: ``color`` -> ``colour`` (NOT the other way).\n- R base-graphics aliases are translated:\n  ``col``/``fg`` -> ``colour``, ``bg`` -> ``fill``, ``pch`` -> ``shape``,\n  ``lty`` -> ``linetype``, ``lwd`` -> ``linewidth``, ``cex`` -> ``size``,\n  ``srt`` -> ``angle``, ``min`` -> ``ymin``, ``max`` -> ``ymax``.\n- Dotted names keep their dots but the trailing token is normalized, e.g.\n  ``segment.color`` -> ``segment.colour``, ``point.color`` -> ``point.colour``\n  (the dot is NOT converted to an underscore).\n- Already-canonical and unknown names pass through unchanged\n  (``x`` -> ``x``, ``linewidth`` -> ``linewidth``, ``NA.value`` -> ``NA.value``).\n"
parameters:
- name: aes_names
  type: Iterable[str]
  required: true
  default: null
  description: Aesthetic names, possibly aliased (American spelling / R graphics names / dotted).
mutates: execution_class=stateless; no declared in-place mutation; returns_kind=value
returns: List[str]; kind=value
requires: []
writes: []
examples:
- 'from ggplot2_py import standardise_aes_names

  assert standardise_aes_names(["color", "lwd", "x"]) == ["colour", "linewidth", "x"]

  '
- 'from ggplot2_py import standardise_aes_names

  assert standardise_aes_names(["segment.color", "pch"]) == ["segment.colour", "shape"]

  '
failure_fixes:
- when: a custom aesthetic name is being lowercased/renamed unexpectedly
  suggest:
  - Only known aliases are remapped; unknown names pass through — check it is not an R alias (col/bg/pch/lty/cex/srt)
