id: ggplot2_py.extension_class_hierarchy
name: Extension class hierarchy (Geom/Stat/Scale/Coord/Position/Facet/Guide)
category: oop
description: "ggplot2 is built on seven abstract base classes that together form the\nextension surface. Every concrete geometry, statistical transform, scale,\ncoordinate system, position adjustment, facet specification, and guide is\na subclass of one of these. The Python port mirrors the R hierarchy\none-to-one, with the addition of `Protocol` classes (in\n`ggplot2_py.protocols`) for structural typing of duck-typed input.\n\nThe 7 base classes (all live in submodules; the top-level `__init__.py`\nre-exports them):\n\n  - `Geom`     (`ggplot2_py.geom.Geom`)      — drawing logic (`draw_panel`,\n                `draw_group`, `draw_layer`, `draw_key`, `setup_data`,\n                `setup_params`, plus class slots `required_aes`,\n                `default_aes`, `non_missing_aes`, `extra_params`).\n  - `Stat`     (`ggplot2_py.stat.Stat`)      — statistical transform\n                (`compute_layer`, `compute_panel`, `compute_group`,\n                `setup_data`, `setup_params`, `required_aes`,\n\
  \                `default_aes`, `dropped_aes`).\n  - `Scale`    (`ggplot2_py.scale.Scale`)    — aesthetic mapping (override\n                by calling `continuous_scale` / `discrete_scale` /\n                `binned_scale` with `super_class=YourScale`).\n  - `Coord`    (`ggplot2_py.coord.Coord`)    — coordinate system\n                (`transform`, `setup_panel_params`, `render_axis_h`,\n                `render_axis_v`, `aspect`).\n  - `Position` (`ggplot2_py.position.Position`) — position adjustment\n                (`compute_layer`, `compute_panel`, `setup_params`,\n                `setup_data`).\n  - `Facet`    (`ggplot2_py.facet.Facet`)    — panel layout\n                (`compute_layout`, `map_data`, `draw_panels`,\n                `setup_params`, `setup_data`).\n  - `Guide`    (`ggplot2_py.guide.Guide`)    — legend / axis rendering\n                (`train`, `merge`, `transform`, `draw`).\n\nTwo-level user-facing pattern: every concrete subclass `GeomX` ships with\na paired factory\
  \ function `geom_x(...)` that returns a `Layer(geom=GeomX,\n...)`. The factory is what users call; the class is what extension\nauthors subclass. Same for `Stat`/`stat_*`, `Position`/`position_*`,\n`Facet`/`facet_*`, `Coord`/`coord_*`, `Scale`/`scale_*_*`,\n`Guide`/`guide_*`.\n\nConcrete implementations live in submodules:\n  - `ggplot2_py.geom.GeomText`, `GeomLabel`, `GeomRect`, `GeomPolygon`,\n     `GeomPoint`, ... (used as subclass parents by ggrepel/ggalluvial).\n  - `ggplot2_py.stat.StatBin`, `StatCount`, `StatIdentity`, ...\n  - `ggplot2_py.coord.CoordCartesian`, `CoordFlip`, `CoordPolar`, ...\n  - `ggplot2_py.position.PositionDodge`, `PositionStack`, ...\n  - `ggplot2_py.facet.FacetGrid`, `FacetWrap`, `FacetNull`.\n\nReal downstream extension examples:\n  - ggrepel-python's `GeomTextRepel(GeomText)` overrides `draw_panel`\n    to inject a force-directed label layout step (see\n    `ggrepel_py/geom_text_repel.py`).\n  - ggalluvial-python's `StatAlluvium(Stat)` overrides `compute_panel`\n\
  \    to reshape long-form alluvial data, and `GeomStratum(GeomRect)`\n    sets a custom `draw_key = draw_key_polygon`.\n  - ggrepel-python's `PositionNudgeRepel(PositionNudge)` overrides\n    `compute_layer` to expose nudge offsets to the geom downstream.\n\nIn all cases the extension class is then wrapped in a factory:\n`def geom_text_repel(...): return layer(geom=GeomTextRepel, ...)`.\n"
invariants:
- 'A concrete `GeomX` must set class attrs: `required_aes` (tuple of str), `default_aes` (Mapping), and pick a `draw_key` (one of `draw_key_point`/`draw_key_path`/`draw_key_rect`/`draw_key_polygon`/`draw_key_text`/`draw_key_label`/`draw_key_blank` or a custom callable).'
- To render, override at least one of `draw_panel(data, panel_params, coord, ...)` or `draw_group(data, panel_params, coord, ...)`; never both unless you call `super()`.
- A concrete `StatX` must override `compute_group` (per-group) or `compute_panel` (whole-panel batch) and set `required_aes` / `default_aes`.
- '`Stat.compute_layer` is the top-level entry point — only override it when you need to side-step the per-group/panel split (rare).'
- To make a new Scale, do NOT subclass `Scale` directly — call `continuous_scale(super_class=YourScale, ...)` or `discrete_scale(...)` or `binned_scale(...)` from within your scale's factory. `Scale` itself is abstract.
- A Position subclass must override `compute_layer` or `compute_panel` and may override `setup_params(data, params)` to validate inputs.
- Class-level slots (`required_aes`, `default_aes`, `extra_params`, `non_missing_aes`, `rename_size`, `optional_aes`) are inheritable — R-style class slots, not instance attributes.
- Concrete classes do NOT need `__init__`; ggplot2-python uses class objects directly (the `Layer` holds the class via `layer(geom=GeomX)`).
- Use `ggproto_parent(ParentClass, self).method(...)` to invoke a parent's method explicitly when overriding (R idiom preserved).
mental_model: "For R users:\nSame as R: `ggproto(\"MyGeom\", Geom, ...)` becomes `class MyGeom(Geom):`\nin Python. `extends` becomes a Python `class X(Parent):`. The slot\nnames (`required_aes`, `default_aes`, `draw_panel`, etc.) are\nidentical — extension authors porting R code can rename the class and\nkeep the slot contents almost verbatim. `ggproto_parent(Parent, self)`\nis preserved as `ggproto_parent(Parent, self).method(...)`.\n\nFor Python users:\nThese are plain Python classes with class-level attributes acting as\n\"slots\". You subclass them like any abstract base. The only nuance:\nmost overrides are STATIC methods or take `self` plus a dataframe and\n`params` dict. Read the parent's signature carefully — `draw_panel`\ntakes `(self, data, panel_params, coord, **kwargs)`, not the\nconventional `(self, *args, **kwargs)`.\n\nGeneral:\nExtension author workflow:\n  1. Pick the right base class (Geom for drawing, Stat for transform,\n     Position for offset, Scale via `*_scale()`\
  \ factory, etc.).\n  2. Subclass it. Override the relevant `compute_*` / `draw_*`\n     methods. Set class-level slots.\n  3. Write a paired factory function `geom_x(mapping=None, data=None,\n     *, stat=..., position=..., show_legend=None, inherit_aes=True,\n     **kwargs) -> Layer` that wraps `layer(geom=YourGeomClass, ...)`.\n  4. Optionally register an entry point under one of the\n     `ggplot2_py.{geoms,stats,positions,scales,coords,facets}` groups\n     so `discover_extensions()` picks the class up by string name."
